<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
body{margin:0;font:14px "Microsoft YaHei",sans-serif;color:#203039}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{padding:7px;border:1px solid #dee5e7;text-align:left;vertical-align:top}th{background:#f2f6f7;font-weight:500}input,select,textarea,button{font:inherit;box-sizing:border-box}input:not([type=checkbox]),select{width:100%;padding:7px;border:1px solid #c6d4d6;border-radius:4px;background:white;color:inherit}input[type=checkbox]{margin:10px 8px 0 0}button{border:0;border-radius:5px;background:#167c80;color:white;padding:9px 15px;cursor:pointer}small{display:block;color:#8b5b17;font-size:12px;margin-top:4px}summary{cursor:pointer;padding:9px 0}details{margin:8px 0}textarea{width:100%;height:70px;padding:6px;border:1px solid #c6d4d6}#hint{font-size:12px;color:#53666a;margin:6px 0 10px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools select{width:180px}.custom{margin-top:5px}#status{color:#a45d10;margin:5px 0}th:first-child{width:25%}th:nth-child(2){width:29%}th:nth-child(3){width:23%}
</style>
<div id="hint">名称、物理量和单位只在此设置。单位选择只更新属性，不换算波形数值。</div>
<table><thead><tr><th>原始通道标识</th><th>名称（图例）</th><th>物理量</th><th>单位</th></tr></thead><tbody id="rows"></tbody></table>
<details id="batch"><summary>批量操作</summary><div class="tools"><label><input type="checkbox" id="all">全选</label><select id="bq" aria-label="批量物理量"></select><select id="bu" aria-label="批量单位"></select><button id="apply">应用到选中通道</button></div><details><summary>粘贴名称</summary><textarea id="names" aria-label="批量名称" placeholder="每行一个，按所选通道原始顺序"></textarea><button id="paste">应用名称</button></details></details>
<div id="status" role="status"></div><button id="save">保存通道属性</button>
<script>
let args,rows=[],presets=[],signature='',selected=new Set();
const $=id=>document.getElementById(id);
function send(type,more={}){parent.postMessage({isStreamlitMessage:true,type,...more},'*')}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function node(tag,text){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function option(select,value,label){const e=node('option',label);e.value=value;select.appendChild(e)}
function find(q){return presets.find(p=>p.id===q)}
function qselect(value,label){let s=node('select');s.setAttribute('aria-label',label);option(s,'','待确认');const main=['current','voltage','active_power','reactive_power','apparent_power','frequency','phase_angle','impedance','energy','temperature','per_unit','switch_state'];let ordered=[...presets].sort((a,b)=>{let ai=main.indexOf(a.id),bi=main.indexOf(b.id);return (ai<0?99:ai)-(bi<0?99:bi)});ordered.forEach(p=>option(s,p.id,p.zh));if(value&&!find(value))option(s,'@'+value,value);option(s,'@new','其他 / 自定义');s.value=find(value)?value:(value?'@'+value:'');return s}
function available(q,unit){let p=find(q);let values=p?[...p.units]:[];if(unit&&!values.includes(unit))values.push(unit);return values}
function units(select,q,unit,keep=false){select.replaceChildren();option(select,'','待确认');if(q==='switch_state')option(select,'@none','无单位');available(q,keep?unit:null).forEach(u=>option(select,u,u));option(select,'@custom','自定义单位');select.value=unit|| (q==='switch_state'?'@none':'')}
function draw(){const root=$('rows');root.replaceChildren();rows.forEach((r,i)=>{let tr=node('tr'),raw=node('td'),label=node('label'),check=node('input');check.type='checkbox';check.setAttribute('aria-label','选择 '+r.raw);check.checked=selected.has(r.channel_id);check.onchange=()=>{check.checked?selected.add(r.channel_id):selected.delete(r.channel_id)};label.append(check,document.createTextNode(r.raw));raw.append(label);tr.append(raw);
 let namecell=node('td'),name=node('input');name.value=r.display_name;name.setAttribute('aria-label',`第${i+1}行名称`);name.oninput=()=>r.display_name=name.value;namecell.append(name);tr.append(namecell);
 let qc=node('td'),qs=qselect(r.quantity_name,`第${i+1}行物理量`),customq=node('input');customq.className='custom';customq.placeholder='自定义物理量';customq.setAttribute('aria-label',`第${i+1}行自定义物理量`);customq.hidden=qs.value!=='@new'&&!qs.value.startsWith('@');customq.value=find(r.quantity_name)?'':r.quantity_name;qc.append(qs,customq);tr.append(qc);
 let uc=node('td'),us=node('select'),customu=node('input'),hint=node('small');us.setAttribute('aria-label',`第${i+1}行单位`);customu.className='custom';customu.placeholder='自定义单位';customu.setAttribute('aria-label',`第${i+1}行自定义单位`);customu.hidden=true;units(us,r.quantity_name,r.unit,true);uc.append(us,customu,hint);tr.append(uc);root.append(tr);
 qs.onchange=()=>{let q=qs.value.startsWith('@')?(qs.value==='@new'?'':qs.value.slice(1)):qs.value;r.quantity_name=q;customq.hidden=!qs.value.startsWith('@');if(!customq.hidden){customq.value=q;customq.focus()}const p=find(q);if(p&& !p.units.includes(r.unit)){r.unit=null;hint.textContent=p.id==='switch_state'?'无单位':`推荐 ${p.default_unit}，请选择数据实际单位；不会换算采样值。`}else{hint.textContent=''}customu.hidden=true;units(us,q,r.unit,true);height()};
 customq.oninput=()=>{r.quantity_name=customq.value;units(us,r.quantity_name,r.unit,true)};
 us.onchange=()=>{customu.hidden=us.value!=='@custom';if(us.value==='@custom'){customu.value=r.unit||'';customu.focus()}else{r.unit=us.value==='@none'||us.value===''?null:us.value;hint.textContent=''}height()};customu.oninput=()=>r.unit=customu.value||null;
 });height()}
$('all').onchange=e=>{selected=e.target.checked?new Set(rows.map(r=>r.channel_id)):new Set();draw()};
$('bq').onchange=()=>{const q=$('bq').value;units($('bu'),q,null);if(q==='@new')$('status').textContent='自定义物理量请在对应表格单元格填写。'};
$('apply').onclick=()=>{if(!selected.size){$('status').textContent='请先选择通道。';height();return}const q=$('bq').value,u=$('bu').value;if(q.startsWith('@')||u==='@custom'){$('status').textContent='自定义内容请在表格对应单元格填写。';height();return;}rows.forEach(r=>{if(selected.has(r.channel_id)){if(q)r.quantity_name=q;r.unit=u==='@none'||!u?null:u}});$('status').textContent='已更新所选行，点击保存通道属性提交。';draw()};
$('paste').onclick=()=>{let target=rows.filter(r=>selected.has(r.channel_id)),names=$('names').value.split(/\r?\n/);if(target.length!==names.length){$('status').textContent='名称行数必须等于选中通道数。';height();return}target.forEach((r,i)=>r.display_name=names[i]);draw()};
$('save').onclick=()=>{if(rows.some(r=>!r.display_name.trim())){$('status').textContent='名称不能为空。';height();return}send('streamlit:setComponentValue',{value:{binding:args.binding,revision:args.revision,nonce:Date.now()+'-'+Math.random(),rows:rows.map(({channel_id,display_name,quantity_name,unit})=>({channel_id,display_name,quantity_name,unit}))},dataType:'json'})};
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;let sig=args.binding+':'+args.revision;if(sig===signature){height();return}signature=sig;rows=structuredClone(args.rows);presets=args.presets;selected=new Set();$('bq').replaceWith(qselect('','批量物理量'));document.querySelector('select[aria-label="批量物理量"]').id='bq';$('bq').onchange=()=>units($('bu'),$('bq').value,null);units($('bu'),'',null);draw()});
new ResizeObserver(height).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></html>
